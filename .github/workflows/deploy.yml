# CI/CD do Cidade Ativa: constrói o site e publica no GitHub Pages.
# - Em pull requests (para main ou develop): só roda o build (integração contínua).
# - Em push na branch main: constrói e publica (entrega contínua).
name: CI/CD - build e deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys ao mesmo tempo; um deploy novo cancela o anterior em andamento
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências (versões do package-lock.json)
        run: npm ci

      - name: Gerar o build de produção
        run: npm run build

      - name: Conferir que o build gerou as páginas
        run: |
          test -f dist/index.html
          test -f dist/html/index.html
          test -f dist/html/projetos.html
          test -f dist/html/cadastro.html
          test -f dist/js/main.js
          test -f dist/css/style.css

      - name: Configurar o GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist como artefato do Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
